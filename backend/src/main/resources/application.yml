spring:
  application:
    name: kaom-sahel-api
  datasource:
    url: ${KAOM_DB_URL:jdbc:postgresql://localhost:5432/kaom}
    username: ${KAOM_DB_USER:kaom}
    password: ${KAOM_DB_PASSWORD:kaom}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    # Le catalogue de démonstration (db/demo) est chargé tant que KAOM_DEMO_DATA vaut true.
    locations: classpath:db/migration${KAOM_DEMO_LOCATION:,classpath:db/demo}
    ignore-migration-patterns: "*:missing"
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 40MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

kaom:
  jwt:
    secret: ${KAOM_JWT_SECRET:dev-secret-a-remplacer-par-une-longue-chaine-aleatoire}
    ttl: ${KAOM_JWT_TTL:12h}
  admin:
    email: ${KAOM_ADMIN_EMAIL:}
    password: ${KAOM_ADMIN_PASSWORD:}
    name: ${KAOM_ADMIN_NAME:Créatrice KAOM}
  uploads:
    dir: ${KAOM_UPLOADS_DIR:./uploads}
  cors-origins: ${KAOM_CORS_ORIGINS:http://localhost:5173}
  shop:
    whatsapp: ${KAOM_WHATSAPP:221770000000}
    instagram: ${KAOM_INSTAGRAM:beauty_of_sahel}
    email: ${KAOM_EMAIL:contact@example.com}
    address: ${KAOM_ADDRESS:Dakar, Sénégal}
    free-shipping-threshold: ${KAOM_FREE_SHIPPING:50000}
