# KAOM · Beauty of Sahel : base de données, API et site.
# Démarrage : cp .env.example .env  (puis remplir)  &&  docker compose up -d --build
name: kaom

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaom}
      POSTGRES_USER: ${POSTGRES_USER:-kaom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${KAOM_API_IMAGE:-ghcr.io/boobasn/beauty_of_sahel-kaom-api}:${KAOM_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      KAOM_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-kaom}
      KAOM_DB_USER: ${POSTGRES_USER:-kaom}
      KAOM_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAOM_JWT_SECRET: ${KAOM_JWT_SECRET:?Définissez KAOM_JWT_SECRET dans .env}
      KAOM_ADMIN_EMAIL: ${KAOM_ADMIN_EMAIL:?Définissez KAOM_ADMIN_EMAIL dans .env}
      KAOM_ADMIN_PASSWORD: ${KAOM_ADMIN_PASSWORD:?Définissez KAOM_ADMIN_PASSWORD dans .env}
      KAOM_ADMIN_NAME: ${KAOM_ADMIN_NAME:-Créatrice KAOM}
      KAOM_CORS_ORIGINS: ${KAOM_CORS_ORIGINS:-http://localhost}
      KAOM_WHATSAPP: ${KAOM_WHATSAPP:-221770000000}
      KAOM_INSTAGRAM: ${KAOM_INSTAGRAM:-beauty_of_sahel}
      KAOM_EMAIL: ${KAOM_EMAIL:-contact@example.com}
      KAOM_ADDRESS: ${KAOM_ADDRESS:-Dakar, Sénégal}
      KAOM_FREE_SHIPPING: ${KAOM_FREE_SHIPPING:-50000}
      KAOM_DEMO_LOCATION: ${KAOM_DEMO_LOCATION-,classpath:db/demo}
    volumes:
      - uploads:/app/uploads

  web:
    image: ${KAOM_WEB_IMAGE:-ghcr.io/boobasn/beauty_of_sahel-kaom-web}:${KAOM_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  db-data:
  uploads:
